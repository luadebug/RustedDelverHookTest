[package]
name = "void"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.windows]
version = "0.61.1"
features = [
    "Win32_Foundation",
    "Win32_Graphics",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_WindowsProgramming",
    "Wdk_System_SystemInformation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL"
]

[dependencies]
once_cell = "1.21.3"
parking_lot = "0.12.3"
gl = "0.14.0"
retour = { version = "0.3.0", features = ["static-detour"] }
egui = "0.31.1"
clipboard = "0.5.0"
win_key_codes = "0.1.2"
jni = "0.21.1"
winsafe = { version = "0.0.23", features = ["kernel"] }
winapi = { version = "0.3.9", features = ["libloaderapi", "consoleapi", "minwindef", "processenv", "winbase", "handleapi", "wingdi", "windef", "winuser", "wincon"] }
